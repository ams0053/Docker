services:
  web:
    image: nginx:latest
    ports: ["8080:80"]
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [php]
  php:
    build: ./php
    volumes: ["./src:/var/www/html"]
    depends_on: [db]
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes: ["db_data:/var/lib/mysql"]
volumes:
  db_data: